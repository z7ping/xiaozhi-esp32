schema_version: "0.2"
status: active

goal:
  summary: "在资源实测可控的前提下，将 ES3C28P 交互 UI 落地到 LCDWiki ESP32-S3"

phase:
  type: verification
  summary: "P0 资源基线：诊断构建已提交，待真机数据验证"

scope:
  include:
    - "ES3C28P 横屏诊断构建与运行时内存观测"
    - "保留已确认的 V2.4 科技像素交互原型作为后续 UI 目标"
  exclude:
    - "在取得真机资源基线前全面替换现有待机 UI"
    - "本阶段修改 Go 服务端与 Jellyfin 播放器"
    - "修改其他开发板与音频传输协议"

constraints:
  required:
    - "最新像素分支是当前开发基线，写入前刷新远程仓库事实"
    - "优先复用已有 LVGL、音频、天气、黄历和服务端播放器"
    - "诊断构建不得在普通版本中增加持续资源开销"
    - "不等待 CI 或 Actions 完成"
  forbidden:
    - "直接修改 main"
    - "未经用户明确要求合并或发布固件"
  frozen:
    - "V2.4 交互原型不因服务端缺少 Seek 而删改"
    - "Jellyfin 媒体搜索与播放控制继续由 Go 服务端承担"
  deferred:
    - action: "完整 LVGL 五屏与播放控制"
      until: "P0 真机资源与音频并发稳定性完成评估"

acceptance:
  - "横屏诊断构建能够读取内部 RAM 和 PSRAM 的空闲、历史低水位、最大连续块"
  - "真机覆盖待机、语音对话、Jellyfin 播放、触摸及天气刷新场景"
  - "观测全程无重启、音频异常或明显内存持续下降"
  - "记录当前尚无真机测试数据，不能将静态代码检查当作测量结果"

progress:
  current:
    - "诊断分支代码已提交；待做 ESP-IDF 构建及真机资源采样"
  next:
    - "编译 lcdwiki-es3c28p-landscape-diag 并烧录 ESP32-S3"
    - "保存串口 ES3C28P_RES 日志，分析最低内存和最大连续块"
    - "通过资源门禁后推进 LVGL 核心 UI 和触摸交互"

decisions:
  - "资源基线优先于完整交互页面实现"
  - "原有普通横屏构建保持默认关闭资源采样"

work_items:
  pull_requests:
    - 2

repository:
  provider: github
  branch: "feat/es3c28p-resource-baseline"
