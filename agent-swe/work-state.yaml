schema_version: "0.2"
status: active

goal:
  summary: "将 LCDWiki ES3C28P 320x240 横屏正式 UI 严格对齐已批准的交互原型 V1.1，保留旧分支实机调试成果与真实服务链路"

phase:
  type: implementation
  summary: "V1.1 原型及计算布局契约已入库，原型门禁在 Chromium 本地验证通过；正式 LVGL 还原和运行态证据尚未完成"

scope:
  include:
    - "V1.1 首页、语音、播放器、万年历、家长设置五页视觉与交互"
    - "从批准 HTML 提取 CSS 几何、字体、SVG、交互和状态契约"
    - "在现有 LVGL/音频/天气/黄历/Go 媒体能力上增量实现"
    - "分级验收：浏览器契约 -> LVGL 树/交互 -> ESP-IDF 编译 -> 真机资源/功能"
  exclude:
    - "更改其他板卡或旧的 feat/es3c28p-touch-ui 调试分支"
    - "重做 Jellyfin 音频链路或服务端实现"

constraints:
  required:
    - "仅在 feat/es3c28p-interactive-ui-v1.1 开发；继承旧分支 e6dc7df 的触摸和播放修复"
    - "V1.1 HTML 为唯一视觉基线，不得自行变更、重新设计或更新基线以消除失败"
    - "复用现有 LVGL 9、Material Symbols、音频设备/协议、天气与黄历能力"
    - "未通过实机验收不可宣称像素级 1:1，不能用模拟数据充当正式结果"
    - "不等待 CI/Actions；资源超预算须提交真实证据"
  forbidden:
    - "直接修改 main、旧调试分支或未经授权合并/发布"
    - "偷偷删除已有的播放列表、Seek、媒体降级等已实现能力"
  frozen:
    - "prototypes/esp32-ui/index.html 当前源文件内容"
    - "Go 服务端仍为 Jellyfin 媒体状态唯一事实源"

acceptance:
  - "原型布局契约校验通过：13 状态、12 SVG 定义、19 类交互动作（含动态日历选日）"
  - "五页 LVGL 实现覆盖可用功能，按浏览器计算坐标自动对齐 2px 容差"
  - "正式运行态文字、图标、动画、触摸手势和空/错/禁用等状态符合设计"
  - "已有设备语音、天气、万年历、Jellyfin、媒体协商及设置功能无回退"
  - "ESP-IDF 编译成功及实机 RAM/PSRAM、触摸/音频并发验收"

progress:
  current:
    - "原始 V1.1 HTML 已存 prototypes/esp32-ui/index.html"
    - "Playwright 计算样式提取器 scripts/extract_es3c28p_ui.py 已创建"
    - "冻结了 prototypes/esp32-ui/ui-baseline.json：320x240、7 个关键稳定状态锚点"
    - "scripts/check_es3c28p_ui.py 本地原型侧 PASS；--strict 需 LVGL 真正运行态树，不提供则 FAIL"
    - "首页按 V1.1 坐标调整入口、时钟、天气/农历与机器人共享槽位，字体/形象仍为 Partial"
    - "新增 BuildVoice 独立语音 UI，PixelRobotDisplay 在实际 connecting/listening/speaking 状态进入；无模拟语音结果"
    - "正式像素渲染与真机暂无证据；播放器、日历、设置尚未完成 V1.1 还原"
  next:
    - "先实现统一 Token / SVG 字形资源映射和首页、独立语音页面"
    - "复用当前播放器/万年历/设置实现并逐项对齐 V1.1"
    - "为 LVGL 增加运行时几何树导出并将状态转移接入真业务"
    - "执行严格门禁、固件构建以及本地烧录真机统一回归"

decisions:
  - "不用真实 LCD 自动截图作为先决条件；浏览器契约与 LVGL 运行时树比较由工程自行处理"
  - "原型所有静态模拟数据必须替换为现有服务真实状态"
  - "旧分支保留用户真机调试成果，新分支独立推进"
  - "统一按已有 High Fidelity UI Adaptation SOP 记录 UI Parity Matrix"

repository:
  provider: github
  branch: "feat/es3c28p-interactive-ui-v1.1"
