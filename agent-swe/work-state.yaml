schema_version: "0.2"
status: active

goal:
  summary: "将 LCDWiki ES3C28P 正式 UI 严格对齐已批准的 V1.1 原型，不破坏原有实机调试成果和真实音频/媒体功能"

phase:
  type: implementation
  summary: "五页代码已改造，新增 3s/1.65s 动画及严格日志门禁；仍需编译、全量几何锚点、字体与实机验证"

scope:
  include:
    - "320x240 首页、语音、播放器、万年历、设置 V1.1 页面、状态与交互"
    - "HTML 计算样式与 SVG/动画契约，LVGL 运行时几何取证"
    - "保留真实天气、黄历、Jellyfin、旧服务端媒体能力协商"
  exclude:
    - "修改 main、其他板卡或原 feat/es3c28p-touch-ui 调试分支"
    - "重做 Go 服务端、Jellyfin 音频数据链"

constraints:
  required:
    - "仅在 feat/es3c28p-interactive-ui-v1.1 分支工作"
    - "prototypes/esp32-ui/index.html 为唯一批准设计基线，不得自动改动"
    - "不使用模拟服务端状态、假 ASR 文本和固定播放内容"
    - "失败门禁保留失败；无硬件或渲染证据不宣布 1:1"
    - "优先复用原 LVGL、Board、Settings、Application 与服务能力；不等待 CI"
  forbidden:
    - "修改原调试分支或未经用户授权合并、发布"
    - "删除已有队列、Seek、停止和旧服务端兼容能力以适配新原型"
  frozen:
    - "prototypes/esp32-ui/index.html"
    - "Go 服务端为媒体状态唯一事实源"

acceptance:
  - "320x240、13 状态、12 SVG、19 交互动作可重复从批准 HTML 提取"
  - "五页和对应交互以 LVGL 正式运行态提供实际证据，关键布局误差不超过 2px"
  - "图标、字体、动画、空态/错误态完成原型适配并留存明确差异"
  - "ESP-IDF 编译、串口诊断、设备触摸、音频及内存回归通过"
  - "旧调试分支保持不变，主分支不受影响"

progress:
  current:
    - "原始 V1.1 HTML 完整纳入 prototypes/esp32-ui/index.html"
    - "本地 Chromium 原型合同检查 PASS，当前无 LVGL 运行时通过证据"
    - "首页采用圆形共享机器人，并展示实际 Wi-Fi/电量、时间、天气和农历"
    - "语音页复用同一机器人，通过真实设备状态及用户识别文本更新 Listening/Thinking/Speaking"
    - "播放器按 V1.1 改布局，保留真实队列、Seek、长按停止、旧服务端禁用逻辑"
    - "万年历和家长设置按 V1.1 重新布局；真实日期、亮度、音量和 NVS 保留"
    - "机器人添加原型 3s 浮动、1.65s 语音环动画与 5s 眨眼；切页主动清除动画"
    - "书本图标改为从 V1.1 SVG 描绘的 LVGL 原生路径，未引入新字体或图像资源"
    - "万年历翻月保留已选日期，底部农历按已有黄历服务实际结果显示"
    - "已修复不存在的 Material Symbols 宏并加字体组件字形回归测试"
    - "严格门禁要求全部 13 个状态，诊断日志每次采样 begin=1，防止旧坐标污染"
    - "宿主 Chromium 原型契约 PASS，串口解析边界测试 PASS；尚未 ESP-IDF 编译、实机验证或 LVGL 全量几何门禁通过"
  next:
    - "在有 ESP-IDF v6.1 环境的工作站构建 lcdwiki-es3c28p-landscape-diag，先解决实际编译错误"
    - "补齐未映射的运行时几何 anchor、字体与 SVG 细节；严禁放宽原型契约"
    - "采集真机串口，执行 UI 严格门禁并逐项收敛差异"
    - "验证实际长按/滑动、语音/媒体并发与设备 RAM/PSRAM"

decisions:
  - "原型 HTML 不修改，动态数据都来自正式设备或服务"
  - "无法自动截图时保留运行时实际坐标与独立真机视觉验收，不伪造像素分数"
  - "复用单一机器人，按原型布局而非继续沿用旧像素风主页"
  - "旧调试分支保留，所有新 UI 调整改在独立新分支"

repository:
  provider: github
  branch: "feat/es3c28p-interactive-ui-v1.1"
