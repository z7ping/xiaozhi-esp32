schema_version: "0.2"
status: active

goal:
  summary: "在 LCDWiki ES3C28P 横屏固件上实现 V2.4 科技像素触摸 UI，并保持原音频链路和低资源开销"

phase:
  type: verification
  summary: "本轮功能编码完成并通过静态契约检查；待本地编译、Go 单测、固件烧录及真机统一验证"

scope:
  include:
    - "P0 资源基线与硬件实测"
    - "P1 首页、像素机器人共享、触摸导航、语音入口"
    - "P2 设置亮度/音量、天气/今日农历展示"
    - "后续播放器状态与触摸控制的 Go 服务端增量对接"
  exclude:
    - "修改其他板卡硬件引脚"
    - "重写 Jellyfin 播放与音频流链路"

constraints:
  required:
    - "只维护固件开发分支 feat/es3c28p-touch-ui，直接以 codex/es3c28p-pixel-robot 为基线"
    - "复用已有 LVGL、Material Symbols、语音、天气和黄历服务"
    - "真机验证 RAM/PSRAM、最大可分配块及对话和媒体并发"
    - "不等待 CI 或 Actions 完成"
  forbidden:
    - "直接修改 main"
    - "未经用户明确授权合并和发布"
    - "使用模拟播放状态冒充真实服务端状态"
  frozen:
    - "V2.4 HTML 原型内容不改"
    - "Go 服务端为 Jellyfin 播放唯一权威状态源"
  deferred:
    - action: "宣布 V2.4 全功能完成和真机性能达标"
      until: "完成 ESP-IDF 编译、全部功能与实机资源验证"

acceptance:
  - "首页显示真实时间/天气/农历，触摸能切换页面及唤醒对话"
  - "亮度、音量滑杆真实生效并持久化"
  - "旧 DashboardUI 不在像素横屏版本中重复分配"
  - "服务端播放器同步、日历日期选择和剩余设置按 V2.4 原型逐项补齐"
  - "真实设备上长时间运行无重启、音频异常或明显内存持续下降"

progress:
  current:
    - "资源诊断代码已整合进固件 PR #3；原 PR #2 已关闭，仍缺真机日志"
    - "固件 PR #3 已增补按需黄历查询、完整队列翻页/选曲、Seek UI、原型字体与布局；缺编译/真机验证"
    - "Go 服务端 PR #3 已增补分页队列、选曲、通用 Seek、可得 MP3 实际时长；设备状态已改为轻量快照以避免复制音频内容，缺 Go 测试与联调"
  next:
    - "使用 ESP-IDF 编译并烧录 lcdwiki-es3c28p-landscape-diag"
    - "验证反复触摸导航与对话恢复，保存内存/音频并发日志"
    - "验证 Go 服务端媒体状态、触摸暂停/切歌与原音频链路，采集并发内存数据"
    - "验证非当天真实黄历查询的错误/配额/断网状态，确认运行资源预算"
    - "验证 MP3 时长可获取性、长音频 Seek 的等待时长及 V2.4 实机视觉一致性"

decisions:
  - "先推进核心 UI 代码，同时保留 P0 真机资源门禁"
  - "页面按需重建，机器人只保留一套 LVGL 对象"
  - "服务端播放器状态通过现有控制通道获取；只在播放器可见时低频轮询"
  - "Seek 使用 Go 端跳过解码帧；未知总时长禁用拖动，黄历数据按需获取"
  - "日历选择只更新现有 LVGL 标签样式，不重复创建网格对象"
  - "同一固件分支承载资源诊断、触摸 UI 与媒体控制；Go 服务端独立单分支"

work_items:
  pull_requests:
    - 3

repository:
  provider: github
  branch: "feat/es3c28p-touch-ui"
